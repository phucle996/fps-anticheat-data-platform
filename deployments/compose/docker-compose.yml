# ==========================================
# Docker Compose Infrastructure Configuration
# PUBG Anti-Cheat Data Platform (Local/Dev)
# ==========================================

version: '3.8'

# Định nghĩa các dịch vụ hạ tầng trung tâm
services:
  # ------------------------------------------
  # 1. Kafka Message Broker (KRaft Mode - confluent)
  # ------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pubg-kafka
    restart: unless-stopped
    ports:
      # Port kết nối Client API từ ngoài host (localhost:9092)
      - "9092:9092"
    environment:
      # Cấu hình Confluent Kafka chạy KRaft (Không cần Zookeeper)
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Cấu hình Listeners cho kết nối nội bộ Docker network và bên ngoài Host
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Cấu hình Cluster ID mặc định (base64 16-byte)
      - CLUSTER_ID=gt3cfdSiRpeCLXZWvoM5Cw
      # Tắt tự động tạo topic để kiểm soát nghiêm ngặt
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      # Volume bảo toàn dữ liệu message queue
      - kafka_data:/var/lib/kafka/data
    networks:
      - pubg-platform-net
    healthcheck:
      # Kiểm tra Kafka sẵn sàng nhận kết nối qua kafka-broker-api-versions
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------
  # 2. MinIO Object Storage (Data Lake S3)
  # ------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: pubg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # Port S3 API Gateway (localhost:9000)
      - "9000:9000"
      # Port Web Console UI (localhost:9001)
      - "9001:9001"
    environment:
      # Tài khoản root quản trị MinIO
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      # Volume bảo toàn dữ liệu Data Lake Parquet/JSON
      - minio_data:/data
    networks:
      - pubg-platform-net
    healthcheck:
      # Kiểm tra liveness endpoint của MinIO
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------
  # 3. Init Container: Kafka Topics Creator
  # ------------------------------------------
  init-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pubg-init-kafka
    depends_on:
      kafka:
        condition: service_healthy # Chỉ chạy sau khi Kafka đã healthy
    volumes:
      - ./init/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh", "kafka:9092"]
    networks:
      - pubg-platform-net

  # ------------------------------------------
  # 4. Init Container: MinIO Bucket Creator
  # ------------------------------------------
  init-minio:
    image: minio/mc:RELEASE.2024-05-09T00-54-15Z
    container_name: pubg-init-minio
    depends_on:
      minio:
        condition: service_healthy # Chỉ chạy sau khi MinIO đã healthy
    environment:
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=pubg-data
    volumes:
      - ./init/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    networks:
      - pubg-platform-net

  # ------------------------------------------
  # 5. Rust Stream Processor Application
  # ------------------------------------------
  rust-processor:
    build:
      context: ../../apps/rust-processor
      dockerfile: Dockerfile
    container_name: pubg-rust-processor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.00' # Cấp tối đa 4 lõi CPU dành riêng cho Rust Processor
          memory: 4G # Cấp tối đa 4GB RAM dành riêng
        reservations:
          cpus: '1.00' # Bảo đảm tối thiểu 1.0 CPU core
          memory: 1G # Bảo đảm tối thiểu 1GB RAM
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      init-minio:
        condition: service_completed_successfully
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_RAW_TOPIC=pubg.v1.player-stat.raw
      - KAFKA_GROUP_ID=rust-processor-group
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=fps-anticheat-datalake
      - BATCH_SIZE=1000
      - FLUSH_INTERVAL_MS=1000
      - RUST_LOG=info
    networks:
      - pubg-platform-net

  # ------------------------------------------
  # 6. Python Machine Learning Worker
  # ------------------------------------------
  python-ml-worker:
    build:
      context: ../../apps/ml-platform/python-ml-worker
      dockerfile: Dockerfile
    container_name: pubg-python-ml-worker
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_GOLD=pubg.v1.dataset.gold.ready
      - KAFKA_TOPIC_MODEL=pubg.v1.ml.model.ready
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET_DATA=fps-anticheat-datalake
      - MINIO_BUCKET_MODEL=pubg-models
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    networks:
      - pubg-platform-net

  # ------------------------------------------
  # 7. Streamlit Web Dashboard (Port 8501)
  # ------------------------------------------
  streamlit-dashboard:
    build:
      context: ../../apps/streamlit-dashboard
      dockerfile: Dockerfile
    container_name: pubg-streamlit-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - GO_API_URL=http://localhost:8081
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET_DATA=fps-anticheat-datalake
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    networks:
      - pubg-platform-net



# ------------------------------------------
# Docker Networks & Volumes Definition
# ------------------------------------------
networks:
  pubg-platform-net:
    name: pubg-platform-net
    driver: bridge

volumes:
  kafka_data:
    name: pubg_kafka_data
  minio_data:
    name: pubg_minio_data
