[package]
name = "rust-inference"
version = "0.1.0"
edition = "2021"
authors = ["DeepMind Agentic Anticheat Team"]
description = "High-Performance Rust ONNX ML Inference Engine & UDS IPC Server"

[dependencies]
# Tokio Multi-threaded Async Runtime cho xử lý song song throughput cao
tokio = { version = "1.38", features = ["full"] }

# Serde mã hóa và giải mã JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.10"
sha2 = "0.10"

# Ghìm phiên bản chrono tương thích hoàn hảo
chrono = "=0.4.38"

# Structured JSON Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Quản lý lỗi định dạng chuẩn hóa
thiserror = "1.0"
anyhow = "1.0"
